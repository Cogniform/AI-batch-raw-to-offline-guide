# CI —— 只读质检：不写回仓库，不做任何发布动作。
#
# 与 static.yml 的分工（本文件不碰 deployment）：
#   - static.yml：数据 schema 校验 + 生成 HTML + 部署 Pages
#   - 本文件：源码闸（ruff lint + 格式 + 单元测试），在 push / PR 时就拦
#
# 判据单一来源：
#   - Ruff 版本来自 pyproject.toml 的 [dependency-groups] dev，锁在 uv.lock；
#   - Python 版本来自仓内 .python-version（由 uv 解析）；
#   - 安装统一 `uv sync --frozen`。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff · Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # 本仓 tests/test_schema_validator.py 是当前唯一的用例文件。
      - name: Pytest
        run: uv run pytest

  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本仓内部 job 增删时规则集无需改动。改本 job 前必读三条：
  #   1. 判定只放 step 级：放 job 级时条件为假会让本 job 变 skipped，
  #      而 GitHub 把 skipped 当 Success —— 那正好是我们要防的假绿。
  #   2. needs 必须列全本文件所有 job id；漏一个，那个 job 红了也照样放行。
  #   3. skipped 一并判红：本 workflow 没有合法的 if: 跳过，出现 skipped
  #      只可能是上游失败级联（上游同在 needs 里，会同时判红）。
  #   注：static.yml（Pages 部署）只在 push main 触发，不在 PR 上跑，不在门禁范围。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1
