[project]
name = "AI-batch-raw-to-offline-guide"
version = "0.1.0"
description = "Offline guide for AI batch raw data processing workflows"
requires-python = ">=3.12"
dependencies = ["jinja2", "openpyxl"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.uv]
# 锁文件源固定为官方 PyPI，且此处优先级高于本机 ~/AppData/Roaming/uv/uv.toml。
# 不加这一段时，本机全局 index-url 指向镜像，任何一次 `uv lock` 都会把 uv.lock
# 的 registry 整片改回镜像（2026-09-27 d9c38de 即如此），CI 在境外拉镜像会超时。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
